[package]
name = "revu"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rand = "0.8"
cpal = "0.15"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
